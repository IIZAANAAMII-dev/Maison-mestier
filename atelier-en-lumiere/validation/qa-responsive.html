<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Contrôle responsive — Maison Mestier</title><style>body{margin:0;background:#d1cec7;color:#24241f;font:14px Arial,sans-serif}header{padding:14px 24px;background:#e9e6de;display:flex;gap:24px;align-items:center}select,button{font:inherit;padding:8px}main{padding:24px;display:grid;place-items:start center}iframe{border:0;background:#e9e6de;box-shadow:0 8px 40px #0002;width:390px;height:844px}a{color:inherit}</style></head><body><header><b>Maison Mestier · contrôle responsive</b><label>Format <select id="format"><option value="390,844">Téléphone 390 × 844</option><option value="320,640">Petit téléphone 320 × 640</option><option value="844,390">Paysage 844 × 390</option><option value="390,600">Téléphone court 390 × 600</option></select></label><a href="./">Vue ordinateur</a></header><main><iframe id="device" title="Maison Mestier — téléphone" src="./"></iframe></main><script>document.getElementById('format').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const frame=document.getElementById('device');frame.style.width=w+'px';frame.style.height=h+'px';});</script></body></html>
